<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>View Testimonials - Admin Dashboard</title>
    <script>
        // Check if user is logged in by verifying admin token
        if (!localStorage.getItem('admin_token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
    <meta name="robots" content="noindex, nofollow">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background: #191C24;
            padding: 15px 0;
            overflow-y: auto;
        }

        .content {
            margin-left: 250px;
            min-height: 100vh;
            background: #151821;
        }

        .bg-secondary {
            background-color: #191C24 !important;
        }

        .testimonial-card {
            background: #191C24;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 20px;
            border-left: 4px solid #007BFF;
            transition: transform 0.2s ease;
        }

        .testimonial-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .client-info {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .client-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007BFF 0%, #0056b3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            margin-right: 15px;
        }

        .testimonial-highlights {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2A2D3A;
        }

        .highlight-tag {
            display: inline-block;
            padding: 4px 12px;
            margin: 2px;
            background: #2A2D3A;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .featured-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #FFD700;
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .filter-section {
            background: #191C24;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .search-box {
            background: #2A2D3A;
            border-color: #3E4651;
            color: #fff;
        }

        .search-box:focus {
            background: #2A2D3A;
            border-color: #007BFF;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .category-filter,
        .sort-filter {
            background: #2A2D3A;
            border-color: #3E4651;
            color: #fff;
        }

        .testimonial-card .text-muted {
            color: #fff !important;
        }
    </style>
</head>

<body>
    <div class="container-fluid position-relative d-flex p-0">
        <!-- Sidebar -->
        <div class="sidebar pe-4 pb-3">
            <nav class="navbar bg-secondary navbar-dark">
                <a href="dashboard.html" class="navbar-brand mx-4 mb-3">
                    <h3 class="text-primary"><i class="fa fa-user-edit me-2"></i>DatabyGagan</h3>
                </a>
                <div class="d-flex align-items-center ms-4 mb-4">
                    <div class="position-relative">
                        <img class="rounded-circle" src="../assets/favicon-192x192.png" alt="Gagan Logo"
                            style="width: 40px; height: 40px;">
                        <div
                            class="bg-success rounded-circle border border-2 border-white position-absolute end-0 bottom-0 p-1">
                        </div>
                    </div>
                    <div class="ms-3">
                        <h6 class="mb-0">Gagan</h6>
                        <span>Admin</span>
                    </div>
                </div>
                <div class="navbar-nav w-100">
                    <a href="dashboard.html" class="nav-item nav-link"><i
                            class="fa fa-tachometer-alt me-2"></i>Dashboard</a>
                    <a href="addproject.html" class="nav-item nav-link"><i class="fa fa-plus me-2"></i>Add Project</a>
                    <a href="viewproject.html" class="nav-item nav-link"><i class="fa fa-list me-2"></i>View
                        Projects</a>
                    <a href="addtestimonial.html" class="nav-item nav-link"><i class="fa fa-quote-right me-2"></i>Add
                        Testimonial</a>
                    <a href="viewtestimonial.html" class="nav-item nav-link active"><i
                            class="fa fa-comments me-2"></i>View Testimonials</a>
                    <a href="#" onclick="logout()" class="nav-item nav-link mt-3"><i
                            class="fa fa-sign-out-alt me-2"></i>Logout</a>
                </div>
            </nav>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="container-fluid pt-4 px-4">
                <div class="row g-4">
                    <div class="col-12">
                        <!-- Filter Section -->
                        <div class="filter-section">
                            <div class="row align-items-center">
                                <div class="col-md-4">
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent text-white border-end-0">
                                            <i class="fa fa-search"></i>
                                        </span>
                                        <input type="text" class="form-control search-box border-start-0"
                                            id="searchInput" placeholder="Search testimonials...">
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select category-filter" id="categoryFilter">
                                        <option value="">All Categories</option>
                                        <option value="General">General</option>
                                        <option value="Power BI">Power BI</option>
                                        <option value="Excel">Excel</option>
                                        <option value="Python">Python</option>
                                        <option value="Data Analysis">Data Analysis</option>
                                        <option value="Dashboard">Dashboard</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select sort-filter" id="sortFilter">
                                        <option value="newest">Newest First</option>
                                        <option value="oldest">Oldest First</option>
                                        <option value="featured">Featured First</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <a href="addtestimonial.html" class="btn btn-primary w-100">
                                        <i class="fa fa-plus me-1"></i>Add New
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Testimonials Container -->
                        <div id="testimonialsContainer">
                            <!-- Testimonials will be loaded here dynamically -->
                        </div>

                        <!-- No Results Message -->
                        <div id="noResults" class="text-center py-5 d-none">
                            <i class="fa fa-search fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">No testimonials found</h4>
                            <p class="text-muted">Try adjusting your search or filters</p>
                        </div>

                        <!-- Loading Spinner -->
                        <div id="loadingSpinner" class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-secondary">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title text-white">Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body text-white">
                    Are you sure you want to delete this testimonial? This action cannot be undone.
                </div>
                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-dark" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <script>
        let testimonials = [];
        let deleteModalInstance;
        let testimonialToDelete;

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('admin_token');
                window.location.href = '/index.html';
            }
        }

        // Initialize delete modal and restore filters
        document.addEventListener('DOMContentLoaded', () => {
            deleteModalInstance = new bootstrap.Modal(document.getElementById('deleteModal'));

            // Set up event handlers for filters
            document.getElementById('searchInput').addEventListener('input', filterTestimonials);
            document.getElementById('categoryFilter').addEventListener('change', filterTestimonials);
            document.getElementById('sortFilter').addEventListener('change', filterTestimonials);

            // Restore filters if coming back from edit
            const savedFilters = sessionStorage.getItem('testimonialFilters');
            if (savedFilters) {
                const { searchTerm, category, sortBy } = JSON.parse(savedFilters);
                document.getElementById('searchInput').value = searchTerm;
                document.getElementById('categoryFilter').value = category;
                document.getElementById('sortFilter').value = sortBy;
                sessionStorage.removeItem('testimonialFilters');
            }

            // Load testimonials
            loadTestimonials();
        });

        // Load testimonials from API
        async function loadTestimonials() {
            try {
                const response = await fetch('/api/testimonials');
                testimonials = await response.json();
                filterTestimonials();
            } catch (error) {
                console.error('Error loading testimonials:', error);
                showError('Failed to load testimonials. Please try again later.');
            } finally {
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        }

        // Filter and display testimonials
        function filterTestimonials() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortFilter').value;

            let filtered = [...testimonials];

            // Apply search filter
            if (searchTerm) {
                filtered = filtered.filter(t =>
                    t.clientName.toLowerCase().includes(searchTerm) ||
                    t.testimonialText.toLowerCase().includes(searchTerm) ||
                    (t.clientCompany && t.clientCompany.toLowerCase().includes(searchTerm))
                );
            }

            // Apply category filter
            if (category) {
                filtered = filtered.filter(t => t.category === category);
            }

            // Apply sorting
            switch (sortBy) {
                case 'newest':
                    filtered.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
                    break;
                case 'oldest':
                    filtered.sort((a, b) => new Date(a.dateAdded) - new Date(b.dateAdded));
                    break;
                case 'featured':
                    filtered.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
                    break;
            }

            displayTestimonials(filtered);
        }

        // Display testimonials in the container
        function displayTestimonials(filteredTestimonials) {
            const container = document.getElementById('testimonialsContainer');
            const noResults = document.getElementById('noResults');

            if (filteredTestimonials.length === 0) {
                container.innerHTML = '';
                noResults.classList.remove('d-none');
                return;
            }

            noResults.classList.add('d-none');
            container.innerHTML = filteredTestimonials.map(t => `
                <div class="testimonial-card position-relative" data-id="${t.id}">
                    ${t.featured ? '<span class="featured-badge"><i class="fas fa-star me-1"></i>Featured</span>' : ''}
                    <div class="client-info">
                        <div class="client-avatar">${t.clientName.charAt(0).toUpperCase()}</div>
                        <div>
                            <div class="fw-bold text-light">${t.clientName}</div>
                            <div class="text-muted">
                                ${[t.clientRole, t.clientCompany, t.clientLocation].filter(Boolean).join(' • ')}
                            </div>
                        </div>
                    </div>
                    <p class="text-light mb-2">${t.testimonialText}</p>
                    ${t.shortQuote ? `<p class="text-muted fst-italic mb-2">"${t.shortQuote}"</p>` : ''}
                    <div class="testimonial-meta text-muted small">
                        <i class="fas fa-calendar me-1"></i>${new Date(t.dateAdded).toLocaleDateString()}
                        <i class="fas fa-tag ms-3 me-1"></i>${t.category}
                        ${t.projectRelated ? `<i class="fas fa-link ms-3 me-1"></i>${t.projectRelated}` : ''}
                    </div>
                    ${t.keyHighlights && t.keyHighlights.length > 0 ? `
                        <div class="testimonial-highlights">
                            ${t.keyHighlights.map(h => `
                                <span class="highlight-tag">${h}</span>
                            `).join('')}
                        </div>
                    ` : ''}
                    <div class="mt-3">
                        <button class="btn btn-sm btn-primary" onclick="editTestimonial('${t.id}')">
                            <i class="fas fa-edit me-1"></i>Edit
                        </button>
                        <button class="btn btn-sm btn-danger ms-2" onclick="showDeleteModal('${t.id}')">
                            <i class="fas fa-trash me-1"></i>Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Show delete confirmation modal
        function showDeleteModal(id) {
            testimonialToDelete = id;
            deleteModalInstance.show();
        }

        // Delete testimonial
        async function deleteTestimonial(id) {
            try {
                const response = await fetch(`/api/testimonials/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    testimonials = testimonials.filter(t => t.id !== id);
                    filterTestimonials();
                    showSuccess('Testimonial deleted successfully');
                } else {
                    throw new Error('Failed to delete testimonial');
                }
            } catch (error) {
                console.error('Error deleting testimonial:', error);
                showError('Failed to delete testimonial. Please try again later.');
            }
        }

        // Edit testimonial
        function editTestimonial(id) {
            // Save current filters state
            const searchTerm = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortFilter').value;

            // Store filters in sessionStorage
            sessionStorage.setItem('testimonialFilters', JSON.stringify({
                searchTerm,
                category,
                sortBy
            }));

            // Navigate to edit page
            window.location.href = `addtestimonial.html?id=${id}`;
        }

        // Show success message
        function showSuccess(message) {
            // Implementation of success notification
        }

        // Show error message
        function showError(message) {
            // Implementation of error notification
        }

        // Set up delete confirmation
        document.getElementById('confirmDelete').addEventListener('click', () => {
            if (testimonialToDelete) {
                deleteTestimonial(testimonialToDelete);
                deleteModalInstance.hide();
                testimonialToDelete = null;
            }
        });
    </script>
</body>

</html>
