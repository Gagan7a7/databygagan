<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>View Blogs - Admin Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background: #191C24;
            padding: 15px 0;
            overflow-y: auto;
        }

        .content {
            margin-left: 250px;
            min-height: 100vh;
            background: #151821;
        }

        .bg-secondary {
            background-color: #191C24 !important;
        }

        .table-dark {
            --bs-table-bg: #191C24;
        }

        body {
            background-color: #151821;
            color: #fff;
        }

        .blog-image {
            width: 60px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }

        .badge-draft {
            background-color: #6c757d;
            color: #fff;
        }

        .badge-published {
            background-color: #28a745;
            color: #fff;
        }
    </style>
</head>

<body>
    <script>
        // Check if user is logged in by verifying admin token
        if (!localStorage.getItem('admin_token')) {
            window.location.href = 'dashboard.html';
        }
    </script>

    <div class="container-fluid position-relative d-flex p-0">
        <!-- Sidebar -->
        <div class="sidebar pe-4 pb-3">
            <nav class="navbar bg-secondary navbar-dark">
                <a href="dashboard.html" class="navbar-brand mx-4 mb-3">
                    <h3 class="text-primary"><i class="fa fa-user-edit me-2"></i>DatabyGagan</h3>
                </a>
                <div class="d-flex align-items-center ms-4 mb-4">
                    <div class="position-relative">
                        <img class="rounded-circle" src="../assets/favicon-192x192.png" alt="Gagan Logo"
                            style="width: 40px; height: 40px;">
                        <div class="bg-success rounded-circle border border-2 border-white position-absolute end-0 bottom-0 p-1"></div>
                    </div>
                    <div class="ms-3">
                        <h6 class="mb-0">Gagan</h6>
                        <span>Admin</span>
                    </div>
                </div>
                <div class="navbar-nav w-100">
                    <a href="dashboard.html" class="nav-item nav-link"><i class="fa fa-tachometer-alt me-2"></i>Dashboard</a>
                    <a href="addproject.html" class="nav-item nav-link"><i class="fa fa-plus me-2"></i>Add Project</a>
                    <a href="viewproject.html" class="nav-item nav-link"><i class="fa fa-list me-2"></i>View Projects</a>
                    <a href="addtestimonial.html" class="nav-item nav-link"><i class="fa fa-quote-right me-2"></i>Add Testimonial</a>
                    <a href="viewtestimonial.html" class="nav-item nav-link"><i class="fa fa-comments me-2"></i>View Testimonials</a>
                    <a href="addblog.html" class="nav-item nav-link"><i class="fa fa-pencil-alt me-2"></i>Add Blog</a>
                    <a href="viewblog.html" class="nav-item nav-link active"><i class="fa fa-book me-2"></i>View Blogs</a>
                    <a href="#" onclick="logout()" class="nav-item nav-link mt-3"><i class="fa fa-sign-out-alt me-2"></i>Logout</a>
                </div>
            </nav>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="container-fluid pt-4 px-4">
                <div class="row g-4">
                    <div class="col-12">
                        <div class="bg-secondary rounded h-100 p-4">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h3 class="text-primary mb-0">All Blog Posts</h3>
                                <button type="button" class="btn btn-success" onclick="loadBlogs()">
                                    <i class="fa fa-refresh me-1"></i>Refresh
                                </button>
                            </div>

                            <!-- Loading indicator -->
                            <div id="loading" class="text-center" style="display: none;">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>

                            <!-- Blogs table -->
                            <div class="table-responsive">
                                <table class="table table-dark table-striped">
                                    <thead>
                                        <tr>
                                            <th scope="col">Cover</th>
                                            <th scope="col">Title</th>
                                            <th scope="col">Category</th>
                                            <th scope="col">Publish Date</th>
                                            <th scope="col">Read Time</th>
                                            <th scope="col">Status</th>
                                            <th scope="col">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="blog-list">
                                        <!-- Blogs loaded dynamically -->
                                    </tbody>
                                </table>
                            </div>

                            <!-- Empty state -->
                            <div id="empty-state" class="text-center py-5" style="display: none;">
                                <i class="fa fa-book-open fa-3x text-muted mb-3"></i>
                                <h4 class="text-muted">No blog posts found</h4>
                                <p class="text-muted">Write your first article to share insight!</p>
                                <a href="addblog.html" class="btn btn-primary">
                                    <i class="fa fa-pencil-alt me-1"></i>Write Blog Post
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <script>
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('admin_token');
                window.location.href = '/index.html';
            }
        }

        let blogs = [];

        function loadBlogs() {
            const loadingEl = document.getElementById('loading');
            const tbody = document.getElementById('blog-list');
            const emptyState = document.getElementById('empty-state');

            loadingEl.style.display = 'block';
            emptyState.style.display = 'none';
            tbody.innerHTML = '';

            fetch('/api/blogs?all=true', {
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('admin_token')
                }
            })
                .then(res => {
                    if (!res.ok) throw new Error('Failed to fetch blogs');
                    return res.json();
                })
                .then(data => {
                    blogs = data || [];
                    renderBlogs();
                    loadingEl.style.display = 'none';
                })
                .catch(err => {
                    console.error(err);
                    loadingEl.style.display = 'none';
                    emptyState.style.display = 'block';
                    alert('Error loading blogs: ' + err.message);
                });
        }

        function renderBlogs() {
            const tbody = document.getElementById('blog-list');
            const emptyState = document.getElementById('empty-state');

            tbody.innerHTML = '';

            if (blogs.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            blogs.forEach((blog) => {
                let imgHtml = '';
                if (blog.image) {
                    imgHtml = `<img src="${blog.image}" alt="${blog.alt || ''}" class="blog-image" onerror="this.src='data:image/svg+xml,<svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"60\\" height=\\"40\\"><rect width=\\"60\\" height=\\"40\\" fill=\\"%23ddd\\"/><text x=\\"50%\\" y=\\"50%\\" text-anchor=\\"middle\\" dy=\\".3em\\" font-family=\\"Arial\\" font-size=\\"8\\" fill=\\"%23999\\">No Image</text></svg>'">`;
                } else {
                    imgHtml = '<div class="blog-image bg-secondary d-flex align-items-center justify-content-center"><i class="fa fa-image text-muted"></i></div>';
                }

                const displayDate = blog.date_published ? new Date(blog.date_published).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : 'N/A';
                const statusClass = blog.status === 'published' ? 'badge-published' : 'badge-draft';
                const statusLabel = blog.status === 'published' ? 'Published' : 'Draft';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${imgHtml}</td>
                    <td><strong>${blog.title || 'Untitled'}</strong><br><small class="text-muted">/${blog.slug}</small></td>
                    <td><span class="badge bg-info">${blog.category || 'automation'}</span></td>
                    <td>${displayDate}</td>
                    <td><small>${blog.read_time || 'Calculated WPM'}</small></td>
                    <td><span class="badge ${statusClass}">${statusLabel}</span></td>
                    <td>
                        <div class="action-buttons">
                            <a href="addblog.html?id=${blog.slug}" class="btn btn-primary btn-sm">
                                <i class="fa fa-edit"></i> Edit
                            </a>
                            <button type="button" class="btn btn-danger btn-sm" onclick="deleteBlog('${blog.slug}')">
                                <i class="fa fa-trash"></i> Delete
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteBlog(slug) {
            if (!confirm('Are you sure you want to delete this blog post? This will remove it from the database and destroy its image in Cloudinary.')) return;

            try {
                const res = await fetch(`/api/blogs/${slug}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('admin_token')
                    }
                }).then(r => r.json());

                if (res.success) {
                    blogs = blogs.filter(b => b.slug !== slug);
                    renderBlogs();
                    alert('Blog post deleted successfully!');
                } else {
                    alert('Error deleting blog: ' + (res.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Error deleting blog: ' + err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlogs);
    </script>
</body>

</html>
