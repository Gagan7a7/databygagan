<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Add Project - Admin Dashboard</title>
    <script>
    // Check if user is logged in by verifying admin token
    if (!localStorage.getItem('admin_token')) {
        window.location.href = 'signin.html';
    }
    </script>
    <meta name="robots" content="noindex, nofollow">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        /* Custom styles to enhance the template */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background: #191C24;
            padding: 15px 0;
            overflow-y: auto;
        }
        .content {
            margin-left: 250px;
            min-height: 100vh;
            background: #151821;
        }
        .bg-secondary {
            background-color: #191C24 !important;
        }
        .form-control {
            background-color: #2A2D3A;
            border-color: #3E4651;
            color: #fff;
        }
        .form-control:focus {
            background-color: #2A2D3A;
            border-color: #007BFF;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .form-control::placeholder {
            color: #adb5bd;
        }
        body {
            background-color: #151821;
            color: #fff;
        }
        .alert {
            margin-top: 1rem;
        }
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
    </style>
</head>
<body>
    <script>
    // Check if user is logged in
    if (!localStorage.getItem('admin_token')) {
        window.location.href = 'signin.html';
    }
    </script>

    <div class="container-fluid position-relative d-flex p-0">
        <!-- Sidebar -->
        <div class="sidebar pe-4 pb-3">
            <nav class="navbar bg-secondary navbar-dark">
                <a href="dashboard.html" class="navbar-brand mx-4 mb-3">
                    <h3 class="text-primary"><i class="fa fa-user-edit me-2"></i>DatabyGagan</h3>
                </a>
                <div class="d-flex align-items-center ms-4 mb-4">
                    <div class="position-relative">
                        <img class="rounded-circle" src="../assets/favicon-192x192.png" alt="Gagan Logo" style="width: 40px; height: 40px;">
                        <div class="bg-success rounded-circle border border-2 border-white position-absolute end-0 bottom-0 p-1"></div>
                    </div>
                    <div class="ms-3">
                        <h6 class="mb-0">Gagan</h6>
                        <span>Admin</span>
                    </div>
                </div>
                <div class="navbar-nav w-100">
                    <a href="dashboard.html" class="nav-item nav-link"><i class="fa fa-tachometer-alt me-2"></i>Dashboard</a>
                    <a href="addproject.html" class="nav-item nav-link active"><i class="fa fa-plus me-2"></i>Add Project</a>
                    <a href="viewproject.html" class="nav-item nav-link"><i class="fa fa-list me-2"></i>View Projects</a>
                    <a href="addtestimonial.html" class="nav-item nav-link"><i class="fa fa-quote-right me-2"></i>Add Testimonial</a>
                    <a href="viewtestimonial.html" class="nav-item nav-link"><i class="fa fa-comments me-2"></i>View Testimonials</a>
                    <a href="#" onclick="logout()" class="nav-item nav-link mt-3"><i class="fa fa-sign-out-alt me-2"></i>Logout</a>
                </div>
            </nav>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="container-fluid pt-4 px-4">
                <div class="row g-4">
                    <div class="col-12">
                        <div class="bg-secondary rounded h-100 p-4">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h3 class="text-primary mb-0">Add New Project</h3>
                                <a href="viewproject.html" class="btn btn-info">
                                    <i class="fa fa-list me-1"></i>View All Projects
                                </a>
                            </div>

                            <!-- Hidden field for edit index (from your original admin.html) -->
                            <input type="hidden" id="edit-index">

                            <form id="add-project-form">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" id="title" placeholder="Project Title" required>
                                            <label for="title">Project Title</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control" id="category" placeholder="e.g. PowerBI, Colab, Other" required>
                                            <label for="category">Category</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="imageUpload" class="form-label">
                                        <i class="fa fa-image me-1"></i>Image Upload
                                    </label>
                                    <input class="form-control" type="file" id="imageUpload" accept="image/*">
                                    <div class="form-text">Upload an image for your project (optional)</div>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="alt" placeholder="Image Alt Text" required>
                                    <label for="alt">Image Alt Text</label>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-floating mb-3">
                                            <input type="url" class="form-control" id="dashboardUrl" placeholder="https://example.com/dashboard" required>
                                            <label for="dashboardUrl">Dashboard URL</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating mb-3">
                                            <input type="url" class="form-control" id="codeUrl" placeholder="https://github.com/yourrepo" required>
                                            <label for="codeUrl">Code URL</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-floating mb-3">
                                    <textarea class="form-control" id="description" placeholder="Describe your project..." style="height: 120px" required></textarea>
                                    <label for="description">Project Description</label>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="tech" placeholder="React, Node.js, MongoDB" required>
                                    <label for="tech">Tech Tags (comma separated)</label>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-success px-4">
                                        <i class="fa fa-save me-1"></i>Save Project
                                    </button>
                                    <button type="button" class="btn btn-secondary px-4" onclick="resetForm()">
                                        <i class="fa fa-refresh me-1"></i>Reset
                                    </button>
                                </div>
                            </form>

                            <!-- Notification area -->
                            <div id="notification-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <script>
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('admin_token');
                window.location.href = 'signin.html';
            }
        }
    
    // Your exact admin.html logic for add/edit/delete projects
    let projects = [];

    // Show notification function
    function showNotification(message, type = 'success') {
        const container = document.getElementById('notification-container');
        const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
        const iconClass = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

        container.innerHTML = `
            <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                <i class="fa ${iconClass} me-2"></i>${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;

        // Auto-dismiss after 5 seconds
        setTimeout(() => {
            const alert = container.querySelector('.alert');
            if (alert) {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            }
        }, 5000);
    }

    // Load projects from API (same as your original admin.html)
    function loadProjects() {
        fetch('/api/projects')
            .then(res => {
                if (!res.ok) throw new Error('Failed to fetch projects from server');
                return res.json();
            })
            .then(data => {
                projects = data || [];
            })
            .catch(err => {
                console.error('Error loading projects:', err);
                showNotification('Error loading projects: ' + err.message, 'error');
            });
    }

    // Form submission handler (your exact logic from admin.html)
    document.getElementById('add-project-form').onsubmit = function(e) {
        e.preventDefault();

        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerHTML;

        // Show loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin me-1"></i>Saving...';

        const idx = document.getElementById('edit-index').value;
        const imageFile = document.getElementById('imageUpload').files[0];

        const proj = {
            title: document.getElementById('title').value,
            category: document.getElementById('category').value,
            image: '', // will be set after upload
            alt: document.getElementById('alt').value,
            dashboardUrl: document.getElementById('dashboardUrl').value,
            codeUrl: document.getElementById('codeUrl').value,
            description: document.getElementById('description').value,
            tech: document.getElementById('tech').value.split(',').map(t => t.trim())
        };

        console.log('Project object being sent:', proj);
        const backendUrl = '/api/projects';

        function saveProjectWithImage(imagePath) {
            proj.image = imagePath;

            if (idx === '') {
                // Add new project
                fetch(backendUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(proj)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        projects.push(proj);
                        resetForm();
                        showNotification('Project added and saved to server successfully!', 'success');
                    } else {
                        showNotification('Error saving project: ' + (data.error || 'Unknown error'), 'error');
                    }
                })
                .catch(err => {
                    showNotification('Error saving project: ' + err.message, 'error');
                })
                .finally(() => {
                    // Reset button state
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                });
            } else {
                // Update existing project
                const editTitle = encodeURIComponent(projects[idx].title);
                fetch(`${backendUrl}/title/${editTitle}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(proj)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        projects[idx] = proj;
                        resetForm();
                        showNotification('Project updated on server successfully!', 'success');
                    } else {
                        showNotification('Error updating project: ' + (data.error || 'Unknown error'), 'error');
                    }
                })
                .catch(err => {
                    showNotification('Error updating project: ' + err.message, 'error');
                })
                .finally(() => {
                    // Reset button state
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                });
            }
        }

        if (imageFile) {
            // Upload image first
            const formData = new FormData();
            formData.append('image', imageFile);

            fetch('/.netlify/functions/upload-image', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.imagePath) {
                    saveProjectWithImage(data.imagePath);
                } else {
                    showNotification('Image upload failed: ' + (data.error || 'Unknown error'), 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                }
            })
            .catch(err => {
                showNotification('Image upload error: ' + err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            });
        } else {
            // No new image uploaded, use previous value if editing
            let imagePath = '';
            if (idx !== '') {
                imagePath = projects[idx] ? projects[idx].image : '';
            }
            saveProjectWithImage(imagePath);
        }
    };

    // Edit project function (for future use if needed)
    function editProject(idx) {
        const proj = projects[idx];
        if (!proj) return;

        document.getElementById('edit-index').value = idx;
        document.getElementById('title').value = proj.title;
        document.getElementById('category').value = proj.category || '';
        document.getElementById('alt').value = proj.alt;
        document.getElementById('dashboardUrl').value = proj.dashboardUrl;
        document.getElementById('codeUrl').value = proj.codeUrl;
        document.getElementById('description').value = proj.description;
        document.getElementById('tech').value = proj.tech.join(', ');

        // Show previous image path (optional)
        if (proj.image) {
            document.getElementById('imageUpload').value = '';
            document.getElementById('imageUpload').setAttribute('data-prev', proj.image);
        }

        // Update form title and button text
        document.querySelector('h3').textContent = 'Edit Project';
        document.querySelector('button[type="submit"]').innerHTML = '<i class="fa fa-save me-1"></i>Update Project';
    }

    // Reset form function (from your original admin.html)
    function resetForm() {
        document.getElementById('edit-index').value = '';
        document.getElementById('add-project-form').reset();

        // Reset form title and button text
        document.querySelector('h3').textContent = 'Add New Project';
        document.querySelector('button[type="submit"]').innerHTML = '<i class="fa fa-save me-1"></i>Save Project';

        // Clear any previous image data
        document.getElementById('imageUpload').removeAttribute('data-prev');
    }

    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        loadProjects();
    });
    </script>
</body>
</html>
