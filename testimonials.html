    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #6bb6ff;
            --accent-color: #ff6b6b;
            --dark-bg: #0a1120;
            --dark-secondary: #0f1419;
            --dark-tertiary: #141920;

            --muted-text: #c0c7d0;
        }

        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .testimonial-card {
            background: var(--dark-secondary);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--shadow-heavy);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.6s ease-out;
        }

        .testimonial-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .testimonial-card:nth-child(odd) {
            transform: translateX(-50px);
        }

        .testimonial-card:nth-child(even) {
            transform: translateX(50px);
            margin-top: 3rem;
        }

        .testimonial-card.visible:nth-child(odd),
        .testimonial-card.visible:nth-child(even) {
            transform: translateX(0);
        }

        .client-info {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .client-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            font-weight: bold;
            margin-right: 1rem;
        }

        .client-details {
            flex: 1;
        }

        .client-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
            color: var(--light-text);
        }

        .client-role {
            color: var(--muted-text);
            font-size: 0.9rem;
        }

        .testimonial-text {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--light-text);
            margin-bottom: 1.5rem;
        }

        .testimonial-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--muted-text);
        }

        .testimonial-date {
            display: flex;
            align-items: center;
        }

        .testimonial-category {
            background: rgba(74, 144, 226, 0.2);
            color: var(--secondary-color);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;
        }

        .key-highlights {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .highlight-tag {
            background: rgba(74, 144, 226, 0.1);
            color: var(--muted-text);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;

        .featured-badge {

    <script>
        // Intersection Observer for scroll animations
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // Load testimonials
        async function loadTestimonials() {
            const grid = document.getElementById('testimonials-grid');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');

            try {
                const response = await fetch('/api/testimonials');
                const testimonials = await response.json();

                loading.style.display = 'none';

                if (!testimonials || testimonials.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                testimonials.forEach(t => {
                    const card = document.createElement('div');
                    card.className = 'testimonial-card';
                    if (t.featured) {
                        card.innerHTML = '<span class="featured-badge"><i class="fas fa-star"></i> Featured</span>';
                    }
                    
                    let roleText = [t.clientRole, t.clientCompany, t.clientLocation]
                        .filter(Boolean)
                        .join(' • ');

                    card.innerHTML += `
                        <div class="client-info">
                            <div class="client-avatar">${t.clientName.charAt(0)}</div>
                            <div class="client-details">
                                <h3 class="client-name">${t.clientName}</h3>
                                <div class="client-role">${roleText || 'Client'}</div>
                            </div>
                        </div>
                        <blockquote class="testimonial-text">${t.testimonialText}</blockquote>
                        <div class="testimonial-meta">
                            <div class="testimonial-date">
                                <i class="far fa-calendar me-2"></i>
                                ${new Date(t.dateAdded).toLocaleDateString()}
                            </div>
                            <div class="testimonial-category">${t.category}</div>
                        </div>
                        ${t.keyHighlights && t.keyHighlights.length > 0 ? `
                            <div class="key-highlights">
                                ${t.keyHighlights.map(h => `
                                    <span class="highlight-tag">${h}</span>
                                `).join('')}
                            </div>
                        ` : ''}
                    `;

                    grid.appendChild(card);
                    observer.observe(card);
                });
            } catch (error) {
                console.error('Error loading testimonials:', error);
                loading.style.display = 'none';
                emptyState.style.display = 'block';
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadTestimonials);
    </script>
