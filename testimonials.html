<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Client Testimonials - Gagan BP | Data Analytics Success Stories</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Stylesheets -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #6bb6ff;
            --accent-color: #ff6b6b;
            --dark-bg: #0a1120;
            --dark-secondary: #0f1419;
            --dark-tertiary: #141920;
            --light-text: #e0e6ed;
            --muted-text: #c0c7d0;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.4);
            --gradient-primary: linear-gradient(135deg, #4a90e2, #6bb6ff);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--light-text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 3rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4rem;
        }

        .testimonials-container {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
        }

        .testimonial-card {
            background: var(--dark-secondary);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--shadow-heavy);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            width: 450px;
            margin-bottom: 3rem;
            position: relative;
            
            /* Initial state - hidden */
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Zigzag positioning */
        .testimonial-card:nth-child(odd) {
            margin-left: 0;
            margin-right: auto;
            transform: translateY(50px) translateX(-50px);
        }

        .testimonial-card:nth-child(even) {
            margin-left: auto;
            margin-right: 0;
            transform: translateY(50px) translateX(50px);
        }

        /* Visible state */
        .testimonial-card.visible {
            opacity: 1;
            transform: translateY(0) translateX(0);
        }

        /* Connecting line in the center */
        .testimonials-container::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, var(--primary-color), transparent);
            transform: translateX(-50%);
            z-index: 0;
        }

        /* Connection dots */
        .testimonial-card::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--primary-color);
            border-radius: 50%;
            top: 50%;
            z-index: 1;
            box-shadow: 0 0 0 4px var(--dark-bg);
            transition: all 0.3s ease;
        }

        .testimonial-card:nth-child(odd)::after {
            right: -31px;
        }

        .testimonial-card:nth-child(even)::after {
            left: -31px;
        }

        .testimonial-card.visible::after {
            background: var(--secondary-color);
            box-shadow: 0 0 0 4px var(--dark-bg), 0 0 20px rgba(107, 182, 255, 0.5);
        }

        .client-info {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .client-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            font-weight: bold;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .client-details {
            flex: 1;
        }

        .client-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0 0 0.25rem 0;
            color: var(--light-text);
        }

        .client-role {
            color: var(--muted-text);
            font-size: 0.9rem;
        }

        .testimonial-text {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--light-text);
            margin-bottom: 1.5rem;
            font-style: italic;
            position: relative;
        }

        .testimonial-text::before {
            content: '"';
            font-size: 4rem;
            color: var(--primary-color);
            position: absolute;
            left: -1rem;
            top: -1rem;
            opacity: 0.3;
            line-height: 1;
        }

        .testimonial-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--muted-text);
            margin-bottom: 1rem;
        }

        .testimonial-date {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .testimonial-category {
            background: rgba(74, 144, 226, 0.2);
            color: var(--secondary-color);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .key-highlights {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .highlight-tag {
            background: rgba(74, 144, 226, 0.1);
            color: var(--muted-text);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            border: 1px solid rgba(74, 144, 226, 0.3);
        }

        .featured-badge {
            position: absolute;
            top: -8px;
            right: 1rem;
            background: var(--gradient-primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: var(--shadow-heavy);
        }

        /* Loading and empty states */
        .loading, .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted-text);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--primary-color);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--gradient-primary);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            font-weight: 500;
            transition: transform 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .testimonials-container::before {
                left: 20px;
            }

            .testimonial-card {
                width: 100%;
                margin-left: 0 !important;
                margin-right: 0 !important;
                padding-left: 3rem;
            }

            .testimonial-card::after {
                left: -31px !important;
                right: auto !important;
            }

            .section-title {
                font-size: 2rem;
            }

            .container {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .testimonial-card {
                padding: 1.5rem;
                padding-left: 2.5rem;
            }

            .client-avatar {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .testimonial-text {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="section">
            <div class="container">
                <h1 class="section-title">Client Testimonials</h1>

                <!-- Loading State -->
                <div id="loading" class="loading">
                    <div class="loading-spinner"></div>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state" style="display: none;">
                    <i class="fas fa-comments"></i>
                    <h2>No testimonials yet</h2>
                    <p>Be the first to share your experience working with me!</p>
                    <a href="contact.html" class="btn">Get in Touch</a>
                </div>

                <!-- Testimonials Container -->
                <div id="testimonials-container" class="testimonials-container"></div>
            </div>
        </section>
    </main>

    <script>
        // Sample testimonials data (replace with your API call)
        const sampleTestimonials = [
            {
                id: 1,
                clientName: "Sarah Johnson",
                clientRole: "Marketing Director",
                clientCompany: "TechCorp Inc",
                clientLocation: "San Francisco, CA",
                testimonialText: "Working with Gagan was an absolute game-changer for our business. The Power BI dashboard he created gave us insights we never knew we needed. Our decision-making process has become so much more data-driven and efficient.",
                category: "Power BI Dashboard",
                keyHighlights: ["Real-time Analytics", "Custom KPIs", "Interactive Reports"],
                dateAdded: "2024-08-15",
                featured: true
            },
            {
                id: 2,
                clientName: "Michael Chen",
                clientRole: "Operations Manager",
                clientCompany: "Global Logistics",
                clientLocation: "Singapore",
                testimonialText: "The Excel automation solution Gagan developed saved us 20+ hours per week. What used to take our team days now happens automatically. The ROI was evident within the first month of implementation.",
                category: "Excel Automation",
                keyHighlights: ["Process Automation", "Time Savings", "Error Reduction"],
                dateAdded: "2024-07-22"
            },
            {
                id: 3,
                clientName: "Emma Rodriguez",
                clientRole: "Data Analyst",
                clientCompany: "FinanceFlow",
                clientLocation: "Madrid, Spain",
                testimonialText: "Gagan's Python analysis uncovered trends in our customer data that completely changed our marketing strategy. His attention to detail and ability to explain complex findings in simple terms is remarkable.",
                category: "Python Analysis",
                keyHighlights: ["Customer Insights", "Predictive Modeling", "Clear Communication"],
                dateAdded: "2024-08-01"
            },
            {
                id: 4,
                clientName: "David Kumar",
                clientRole: "CEO",
                clientCompany: "StartupX",
                clientLocation: "Bangalore, India",
                testimonialText: "As a startup, we needed someone who could work with limited data and still provide valuable insights. Gagan exceeded our expectations and helped us make crucial business decisions with confidence.",
                category: "Business Intelligence",
                keyHighlights: ["Strategic Insights", "Cost-effective", "Fast Delivery"],
                dateAdded: "2024-07-10",
                featured: true
            },
            {
                id: 5,
                clientName: "Lisa Thompson",
                clientRole: "HR Director",
                clientCompany: "People First Corp",
                clientLocation: "Toronto, Canada",
                testimonialText: "The HR analytics dashboard Gagan created transformed how we understand our workforce. We can now predict turnover, identify high performers, and make data-driven HR decisions.",
                category: "HR Analytics",
                keyHighlights: ["Employee Insights", "Turnover Prediction", "Performance Metrics"],
                dateAdded: "2024-06-28"
            }
        ];

        // Intersection Observer for scroll animations
        const observerOptions = {
            root: null,
            rootMargin: '0px 0px -100px 0px',
            threshold: 0.3
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // Load testimonials from your API
        async function loadTestimonials() {
            const container = document.getElementById('testimonials-container');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');

            try {
                const response = await fetch('/api/testimonials');
                const testimonials = await response.json();

                loading.style.display = 'none';

                if (!testimonials || testimonials.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                testimonials.forEach(t => {
                    const card = document.createElement('div');
                    card.className = 'testimonial-card';
                    
                    let roleText = [t.clientRole, t.clientCompany, t.clientLocation]
                        .filter(Boolean)
                        .join(' • ');

                    card.innerHTML = `
                        ${t.featured ? '<span class="featured-badge"><i class="fas fa-star"></i> Featured</span>' : ''}
                        <div class="client-info">
                            <div class="client-avatar">${t.clientName.charAt(0)}</div>
                            <div class="client-details">
                                <h3 class="client-name">${t.clientName}</h3>
                                <div class="client-role">${roleText || 'Client'}</div>
                            </div>
                        </div>
                        <blockquote class="testimonial-text">${t.testimonialText}</blockquote>
                        <div class="testimonial-meta">
                            <div class="testimonial-date">
                                <i class="far fa-calendar"></i>
                                ${new Date(t.dateAdded).toLocaleDateString()}
                            </div>
                            <div class="testimonial-category">${t.category}</div>
                        </div>
                        ${t.keyHighlights && t.keyHighlights.length > 0 ? `
                            <div class="key-highlights">
                                ${t.keyHighlights.map(h => `
                                    <span class="highlight-tag">${h}</span>
                                `).join('')}
                            </div>
                        ` : ''}
                    `;

                    container.appendChild(card);
                    observer.observe(card);
                });
            } catch (error) {
                console.error('Error loading testimonials:', error);
                loading.style.display = 'none';
                emptyState.style.display = 'block';
            }
        }
