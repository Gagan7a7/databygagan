[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CLOUDINARY_CLOUD_NAME"

[build.processing]
  skip_processing = true

# ─── Redirects ────────────────────────────────────────────────────────────────

# Dynamic sitemap: serve from serverless function
[[redirects]]
  from   = "/sitemap.xml"
  to     = "/.netlify/functions/sitemap"
  status = 200
  force  = true

# Clean URLs: strip .html
[[redirects]]
  from = "/faq.html"
  to   = "/faq"
  status = 301
  force  = true

[[redirects]]
  from = "/resume"
  to   = "/about"
  status = 301
  force  = true

[[redirects]]
  from = "/resume.html"
  to   = "/about"
  status = 301
  force  = true

[[redirects]]
  from = "https://www.databygagan.com/*"
  to   = "https://databygagan.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "/*.html"
  to   = "/:splat"
  status = 301
  force  = true

# Netlify Functions proxy (only needs to be declared once)
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

# SPA-style fallback
[[redirects]]
  from   = "/*"
  to     = "/:splat.html"
  status = 200

# Force HTTPS
[[redirects]]
  from   = "http://*"
  to     = "https://:splat"
  status = 301
  force  = true

# Protect admin routes
[[redirects]]
  from   = "/admin"
  to     = "/admin/signin.html"
  status = 302
  force  = true
  conditions = {Role = ["!admin"]}

[[redirects]]
  from   = "/admin/*"
  to     = "/admin/signin.html"
  status = 302
  force  = true
  conditions = {Role = ["!admin"]}

[[redirects]]
  from   = "*/admin/*"
  to     = "/404.html"
  status = 404


# ─── Headers ──────────────────────────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https: https://formspree.io; form-action 'self' https://formspree.io;"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options           = "DENY"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS & JS: force revalidation (fixes mobile cache issues)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control             = "no-store, no-cache, must-revalidate, private"
    Content-Security-Policy   = "default-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;"
    Referrer-Policy           = "no-referrer"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    X-Robots-Tag              = "noindex, nofollow"
    X-XSS-Protection          = "1; mode=block"

# ─── Plugins ──────────────────────────────────────────────────────────────────

[[plugins]]
  package = "netlify-plugin-checklinks"
  [plugins.inputs]
    checkExternal = false

    entryPoints = [
      "index.html",
      "about.html",
      "contact.html",
      "faq.html",
      "testimonials.html",
      "skills.html",
      "projects.html",
      "servicescroll.html",
      "services.html"
    ]

    # KEY FIX: explicit literal match for the failing URL (no leading slash,
    # found inside inlined JS — glob "api/*" doesn't always cover this)
    # All patterns below are treated as substring matches by hyperlink.
    skipPatterns = [
      "api/",           # catches api/projects, api/anything — no slash prefix needed
      "/api/",          # catches /api/projects etc.
      "/.netlify/",
      "/admin",
      "*/admin/*",
      "https://fonts.gstatic.com",
      "https://fonts.googleapis.com",
      "https://www.googletagmanager.com",
      "https://www.google-analytics.com",
      "https://cdnjs.cloudflare.com",
      "#automation",
      "#automation-services",
      "#analytics-services",
      "#web-services",
      "#data",
      "#web"
    ]

    todoPatterns = [
      "#automation",
      "#data",
      "#web"
    ]