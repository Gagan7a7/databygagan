
[build]
  functions = "netlify/functions"
  publish = "."

# Disable automatic sitemap generation
[build.processing]
  skip_processing = true

# Plugin configurations
[[plugins]]
  package = "netlify-plugin-checklinks"
  [plugins.inputs]
    # Skip checking external links that often timeout during builds
    skipPatterns = [
      "https://fonts.googleapis.com/*",
      "https://www.googletagmanager.com/*",
      "https://www.google-analytics.com/*",
      "https://cdnjs.cloudflare.com/*",
      "https://fonts.gstatic.com/*"
    ]
    # Only check internal links and allow specific external domains
    checkExternal = false

# Redirect .html URLs to clean URLs
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Force HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Protect all admin routes with authentication
[[redirects]]
  from = "/admin"
  to = "/admin/signin.html"
  status = 302
  force = true
  conditions = {Role = ["!admin"]}

[[redirects]]
  from = "/admin/*"
  to = "/admin/signin.html"
  status = 302
  force = true
  conditions = {Role = ["!admin"]}

# Return 404 for any direct admin file access
[[redirects]]
  from = "*/admin/*"
  to = "/404.html"
  status = 404

# Protect all admin routes
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https:;"
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    Referrer-Policy = "no-referrer"
