[build]
  functions = "netlify/functions"
  publish = "."

# Disable automatic sitemap generation
[build.processing]
  skip_processing = true

# Redirect .html URLs to clean URLs
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Force HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Protect all admin routes with authentication
[[redirects]]
  from = "/admin"
  to = "/admin/signin.html"
  status = 302
  force = true
  conditions = {Role = ["!admin"]}

[[redirects]]
  from = "/admin/*"
  to = "/admin/signin.html"
  status = 302
  force = true
  conditions = {Role = ["!admin"]}

# Return 404 for any direct admin file access
[[redirects]]
  from = "*/admin/*"
  to = "/404.html"
  status = 404

# Protect all admin routes
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;"
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    Referrer-Policy = "no-referrer"

# FORCE REVALIDATION FOR CSS & JS (Fixes Mobile Cache Issues)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Link checker plugin with crash prevention
[[plugins]]
  package = "netlify-plugin-checklinks"
  [plugins.inputs]
    # Only check HTML files
    entryPoints = ["*.html"]
    # Disable external link checking to prevent build crashes
    checkExternal = false
    # Skip the future SEO anchors that don't have headings yet
    # Also skip admin routes, API endpoints, and service page anchors
    skipPatterns = [
        "/admin",
        "/admin/*",
        "/api/*",
        "*/admin/*",
        "#automation",
        "#automation-services",
        "#analytics-services",
        "#web-services",
        "#data",
        "#web"
    ]
    todoPatterns = [
        "#automation",
        "#data",
        "#web"
    ]